name: GI & Hepatology Weekly Digest (Gemini)

on:
  schedule:
    - cron: "30 1 * * 1"  # Monday 09:30 HKT = Monday 01:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = exercise the pipeline but do NOT send the email"
        required: false
        default: ""
        type: string
      back_days:
        description: "Override the look-back window in days (default 14)"
        required: false
        default: ""
        type: string
      max_items:
        description: "Override how many items are analysed (default 34)"
        required: false
        default: ""
        type: string
      fetch_source:
        description: "auto (default) | pubmed | epmc — pin the fetch tier"
        required: false
        default: ""
        type: string
      ignore_seen:
        description: "1 = ignore the seen-PMID cache (re-analyse everything)"
        required: false
        default: ""
        type: string
      nlm_artifacts:
        description: "NotebookLM dashboards to generate (default 3, 0 = skip)"
        required: false
        default: ""
        type: string

permissions:
  # write: the run commits its digest archive + seen-PMID state back to the
  # repo after every successful run — that push is what resets GitHub's
  # 60-day scheduled-workflow auto-disable clock.
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gi-hep-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the archive-commit step rebases before pushing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — required repository secrets
        # Public repo: a forker must supply their own secrets, and a missing one
        # must fail HERE with a clear message instead of surfacing mid-run as a
        # misleading auth error (or silently producing no digest).
        # Only secret NAMES are ever printed — never values.
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          missing=""
          for v in GEMINI_SID GEMINI_TS GEMINI_API_KEY SMTP_USER SMTP_PASS RECIPIENT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required repository secret(s):$missing — add them under Settings → Secrets and variables → Actions (see README 'Secrets')."
            exit 1
          fi
          echo "required secrets present: GEMINI_SID GEMINI_TS GEMINI_API_KEY SMTP_USER SMTP_PASS RECIPIENT (values never printed)"
          if [ -z "$NLM_STORAGE_STATE_GZ" ]; then
            echo "::warning::NLM_STORAGE_STATE_GZ not set — NotebookLM dashboards will be skipped (the matplotlib evidence-mix chart and the locally rendered poster still ship)"
          fi

      - name: Setup Gemini auth (env cookies -> auth.json)
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p ~/.gemini-cli
          printf '{"__Secure-1PSID":"%s","__Secure-1PSIDTS":"%s"}\n' \
            "$GEMINI_SID" "$GEMINI_TS" > ~/.gemini-cli/auth.json
          python3 -c "import json;d=json.load(open('$HOME/.gemini-cli/auth.json'));print('gemini cookies:', 1 if d.get('__Secure-1PSID') else 0)"

      - name: Check Gemini backends (liveness)
        # Presence is checked above; this checks VALIDITY. A dead web session
        # used to surface only as a failed analysis batch mid-run, after the
        # fetch — and three timed-out web attempts burn ~15 min before the
        # API fallback is even tried. Never fails the job itself: if the web
        # session is dead we skip straight to the API backend (GEMINI_WEB_DEAD)
        # and let the run decide; if the API key is dead too, the run fails
        # with a clear error instead of a misleading auth error.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          WEB_OK=0
          if timeout 120 python3 gemini.py --account-status > /tmp/gemini_status.json 2>/tmp/gemini_status.err; then
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/gemini_status.json')).get('ok') else 1)"; then
              WEB_OK=1
              echo "gemini web auth: live"
            else
              echo "::warning::gemini web auth check returned ok=false — API backend will be used"
            fi
          else
            echo "::warning::gemini web auth check failed (see log) — API backend will be used"
          fi
          if [ "$WEB_OK" != "1" ]; then
            echo "GEMINI_WEB_DEAD=1" >> "$GITHUB_ENV"
          fi
          if curl -s -m 30 "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" | grep -q '"models"'; then
            echo "gemini api key: valid"
          else
            echo "::warning::gemini API key did not list models — the API fallback may be unavailable"
          fi

      - name: Setup NotebookLM session (storage state)
        env:
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NLM_STORAGE_STATE_GZ" | base64 -d | gunzip > \
            ~/.notebooklm/profiles/default/storage_state.json
          python3 -c "import json;d=json.load(open('$HOME/.notebooklm/profiles/default/storage_state.json'));print('nlm cookies:',len(d.get('cookies',[])))"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Static key: the install step below skips the download when the
          # browser is already present, so the cache saves minutes every run.
          key: ms-playwright-${{ runner.os }}-v1

      - name: Install playwright (NotebookLM image download)
        run: |
          pip install playwright
          python3 -m playwright install chromium --with-deps

      - name: Restore seen-PMID state
        uses: actions/cache@v4
        with:
          path: state
          # Rolling key: a fixed key always HITS, and a hit skips the save, so
          # the dedup state would freeze and every run would re-report the
          # whole window. Unique key + prefix restore keeps the newest snapshot
          # flowing to the next run.
          key: gihep-seen-${{ github.run_id }}
          restore-keys: gihep-seen-

      - name: Clear stale run outputs
        # The seen-state cache restores the whole state/ dir, so a previous
        # run's digest_b*.md / audit_*.json would survive into this run and
        # pollute the QA artifact upload (2026-11-25 dry run shipped a stale
        # digest_b2.md from 2026-11-23). seen_ids.json itself must stay.
        run: rm -f state/digest_b*.md state/audit_*.json

      - name: Run GI & Hepatology weekly digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          NOTEBOOKLM_TRANSPORT: curl_cffi
          RUN_BACK_DAYS: ${{ github.event.inputs.back_days }}
          ANALYSIS_MAX_ITEMS: ${{ github.event.inputs.max_items }}
          FETCH_SOURCE: ${{ github.event.inputs.fetch_source }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
          NLM_ARTIFACTS: ${{ github.event.inputs.nlm_artifacts }}
          SEEN_STATE_IGNORE: ${{ github.event.inputs.ignore_seen }}
        run: |
          if [ "$SEEN_STATE_IGNORE" = "1" ]; then rm -f state/seen_ids.json; fi
          python3 gi_hep_weekly.py

      - name: Upload digest artifacts (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gihep-digest-output
          path: |
            ~/.hermes/digest_images/gihep_chart_*.png
            ~/.hermes/digest_images/gihep_nlm_*.png
            ~/.hermes/digest_images/gihep_poster_*.png
            /tmp/gihep_digest_email.html
            state/digest_b*.md
            state/audit_*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Alert on audit errors
        # Reads the audit JSON the run writes to state/audit_<date>.json
        # (the old grep over a .log file that was never written was a no-op).
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, json
          files = sorted(glob.glob("state/audit_*.json"))
          if not files:
              print("::warning::no audit JSON found — the number check may not have run")
          else:
              d = json.load(open(files[-1]))
              errs = d.get("errors", [])
              warns = d.get("warnings", [])
              print(f"audit {d.get('date')}: {d.get('blocks', 0)} blocks, "
                    f"{len(errs)} error(s), {len(warns)} warning(s)")
              if errs:
                  print(f"::warning::digest_audit reported {len(errs)} number error(s) — see inline ⚠ badges")
          EOF

      - name: Commit digest archive (resets the 60-day clock)
        # Commits the sent digest's HTML + run manifest and the updated
        # seen-PMID state. The push is what keeps the scheduled workflow
        # alive (GitHub disables schedules after 60 days of repo inactivity)
        # and creates a permanent, browsable archive of every digest sent.
        # Best-effort: a push failure must never fail the run, and nothing
        # is committed when nothing was sent (dry run / WARN run).
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive state/seen_ids.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "digest archive $(date +%F)"
          git pull --rebase origin main || true
          git push origin main
